{% extends "base.html" %}
{% block title %}Добавить предысторию — CYBERPUNK 2079{% endblock %}

{% block content %}
<header class="page-head">
    <div class="eyebrow">Админ-панель</div>
    <h1>Новая предыстория</h1>
</header>
<div class="panel form-card">
    <form method="post" class="cyber-form">
        <label for="b-name">Название</label>
        <input id="b-name" type="text" name="name" required>
        <label for="b-desc">Описание</label>
        <textarea id="b-desc" name="description" rows="4" required></textarea>
        <label for="b-sk">Навыки (через запятую)</label>
        <input id="b-sk" type="text" name="skill_proficiencies" required>
        <label for="b-eq">Снаряжение</label>
        <textarea id="b-eq" name="equipment" rows="3" required></textarea>
        <label for="b-lang">Языки</label>
        <input id="b-lang" type="text" name="languages">
        <label for="b-fn">Название особенности</label>
        <input id="b-fn" type="text" name="feature_name" required>
        <label for="b-fd">Описание особенности</label>
        <textarea id="b-fd" name="feature_description" rows="3" required></textarea>

        <h3 class="form-section">Группы выбора (клан, деятельность и т.п.)</h3>
        <div id="groups-container">
            <div class="dynamic-group">
                <label>Заголовок группы (например: "Выбор клана")</label>
                <input type="text" name="group_title[]">
                <label>Опции (каждая строка в формате "Название: бонус")</label>
                <textarea name="group_options[]" rows="3" placeholder="Клан Миротворцев: +1 к Присутствию&#10;Семья Альдекальдо: +1 к Эго"></textarea>
            </div>
        </div>
        <div class="form-actions">
            <button type="button" onclick="addGroup()" class="btn btn--ghost">+ Ещё группа выбора</button>
            <button type="submit" class="btn">Создать предысторию</button>
        </div>
    </form>
</div>
<script>
    function addGroup() {
        const container = document.getElementById('groups-container');
        const div = document.createElement('div');
        div.className = 'dynamic-group';
        div.innerHTML = `
            <label>Заголовок группы</label>
            <input type="text" name="group_title[]">
            <label>Опции (строка: бонус)</label>
            <textarea name="group_options[]" rows="3"></textarea>
        `;
        container.appendChild(div);
        div.querySelector('input').focus();
    }
</script>
{% endblock %}
