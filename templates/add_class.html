{% extends "base.html" %}
{% block title %}Добавить класс — CYBERPUNK 2079{% endblock %}

{% block content %}
<header class="page-head">
    <div class="eyebrow">Админ-панель</div>
    <h1>Новый класс</h1>
</header>
<div class="panel form-card">
    <form method="post" class="cyber-form">
        <label for="f-name">Название класса</label>
        <input id="f-name" type="text" name="name" required>
        <label for="f-hd">Кость Хитов</label>
        <input id="f-hd" type="text" name="hit_dice" placeholder="1к10 за каждый уровень" required>
        <label for="f-hp1">Хиты на 1 уровне</label>
        <input id="f-hp1" type="text" name="hp_first_level" placeholder="10 + модификатор СИСТЕМА">
        <label for="f-hp">Хиты на следующих уровнях</label>
        <input id="f-hp" type="text" name="hp_next_level" placeholder="1к10 (или 6) + модификатор" required>
        <label for="f-w">Владение оружием</label>
        <input id="f-w" type="text" name="weapon_proficiencies" required>
        <label for="f-t">Инструменты</label>
        <input id="f-t" type="text" name="tool_proficiencies" placeholder="Нет">
        <label for="f-s">Спасброски</label>
        <input id="f-s" type="text" name="save_proficiencies" required>
        <label for="f-sk">Навыки</label>
        <input id="f-sk" type="text" name="skill_proficiencies" required>
        <label for="f-eq">Снаряжение (можно с переносами)</label>
        <textarea id="f-eq" name="equipment" rows="4" required></textarea>
        <label for="f-fs">Боевой стиль (опционально)</label>
        <textarea id="f-fs" name="fighting_style_choice" rows="5" placeholder="Стрелок: +2 к урону..."></textarea>
        <label for="f-sw">Второе дыхание (опционально)</label>
        <textarea id="f-sw" name="second_wind" rows="2"></textarea>

        <h3 class="form-section">Особенности класса</h3>
        <div id="features-container">
            <div class="dynamic-feature">
                <label>Название особенности</label>
                <input type="text" name="feature_name[]" placeholder="Например: Боевой стиль">
                <label>Описание</label>
                <textarea name="feature_description[]" rows="2"></textarea>
            </div>
        </div>
        <div class="form-actions">
            <button type="button" onclick="addFeature()" class="btn btn--ghost">+ Ещё особенность</button>
            <button type="submit" class="btn">Создать класс</button>
        </div>
    </form>
</div>
<script>
    function addFeature() {
        const container = document.getElementById('features-container');
        const div = document.createElement('div');
        div.className = 'dynamic-feature';
        div.innerHTML = `
            <label>Название особенности</label>
            <input type="text" name="feature_name[]" placeholder="Особенность">
            <label>Описание</label>
            <textarea name="feature_description[]" rows="2"></textarea>
        `;
        container.appendChild(div);
        div.querySelector('input').focus();
    }
</script>
{% endblock %}
